name: wp-pilot

services:
  db:
    image: mariadb:11
    container_name: wp-pilot-db
    restart: unless-stopped
    ports:
      - "33081:3306"
    environment:
      MARIADB_ROOT_PASSWORD: wp-root-Lx83k
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wp-dev-Qm27v
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:latest
    container_name: wp-pilot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8181:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wp-dev-Qm27v
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8181');
        define('WP_SITEURL', 'http://localhost:8181');
    volumes:
      - wp_data:/var/www/html

  fleet:
    image: wordpress:latest
    container_name: wp-fleet
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8282:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: fleet
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wp-dev-Qm27v
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8282');
        define('WP_SITEURL', 'http://localhost:8282');
    volumes:
      - fleet_data:/var/www/html

  wpcli:
    image: wordpress:cli
    container_name: wp-pilot-cli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wp-dev-Qm27v
    volumes:
      - wp_data:/var/www/html
      - ./scripts:/var/www/html/scripts
      - ./content:/var/www/html/content
    entrypoint: wp
    command: "--info"
    profiles: ["cli"]

  fleetcli:
    image: wordpress:cli
    container_name: wp-fleet-cli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: fleet
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wp-dev-Qm27v
    volumes:
      - fleet_data:/var/www/html
    entrypoint: wp
    command: "--info"
    profiles: ["cli"]

volumes:
  db_data:
  wp_data:
  fleet_data:
